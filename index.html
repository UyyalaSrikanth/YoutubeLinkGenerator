<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Deep Link Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    input, button { padding: 10px; width: 90%; margin: 10px auto; font-size: 16px; }
    .link-box { margin-top: 20px; word-break: break-all; }
  </style>
</head>
<body>
  <h2>YouTube App Link Generator</h2>
  <input type="text" id="yturl" placeholder="Paste YouTube Link">
  <button onclick="generateLink()">Generate Link</button>
  <div class="link-box" id="outputLink"></div>

  <script>
    function generateLink() {
      const url = document.getElementById("yturl").value.trim();
      const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
      const match = url.match(regExp);
      const videoId = (match && match[7].length === 11) ? match[7] : null;

      if (videoId) {
        const generatedLink = `${window.location.origin}/watch.html?id=${videoId}`;
        document.getElementById("outputLink").innerHTML = `
          <p><strong>Share this link:</strong></p>
          <input type="text" value="${generatedLink}" onclick="this.select()" readonly>
        `;
      } else {
        alert("Invalid YouTube URL");
      }
    }
  </script>
</body>
</html>
